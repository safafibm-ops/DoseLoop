# Builds the Android app (APK) from the web app with Capacitor.
# Every PR: build only (the APK is attached to the run as an artifact).
# Every push to main: also publishes it as the "apk-latest" release, which the
# app's "Get the app" button downloads.
name: Android APK
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk DoseLoop.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DoseLoop-apk
          path: DoseLoop.apk
      - name: Publish as the apk-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest DoseLoop.apk \
            --target "$GITHUB_SHA" \
            --title "DoseLoop Android app (latest)" \
            --notes "Debug build of commit $GITHUB_SHA. Install: open DoseLoop.apk on the phone and allow installing unknown apps. Demo data, lab validation pending."
